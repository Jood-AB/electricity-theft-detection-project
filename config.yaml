# Shared settings for the whole project.
# Every script reads its settings from this file, so all four members
# use the same values. Change a value here, not inside the code.

# Starting number for all random choices (data split, Random Forest,
# cross-validation). The same seed gives the same results on every run
# and on every computer.
random_seed: 42

# How the test set is chosen. The test set is used ONCE at the end.
# All tuning uses the training data only.

# SGCC: fraction of customers held out for the final test (0.2 = 20%).
# Each row is one customer, so no customer is in both sets.
test_size: 0.2

# OEDI: the file holds 4 one-year recordings for each of 16 building types.
# For each type, this many recordings go to the test set and the rest to
# training (1 of 4 = 25% test). No recording is in both sets.
oedi_test_recordings_per_type: 1

# Folder locations, relative to the project's main folder.
# The two datasets are always kept and processed separately.
paths:
  sgcc_raw: data/raw/sgcc/              # original SGCC download
  oedi_raw: data/raw/oedi/              # original OEDI-based download
  sgcc_processed: data/processed/sgcc/  # cleaned SGCC data and train/test split
  oedi_processed: data/processed/oedi/  # cleaned OEDI data and train/test split
  outputs: outputs/                     # plots, results tables and other generated files
