# Look of the demo app (demo/app.py). Light theme, one calm teal accent.
[theme]
base = "light"
primaryColor = "#0F766E"             # teal: buttons, selected tabs, progress bars
backgroundColor = "#F4F6F8"          # soft grey page
secondaryBackgroundColor = "#FFFFFF" # white inputs and widgets
textColor = "#1F2933"
font = "sans serif"

[client]
toolbarMode = "minimal"   # hide developer menu items
